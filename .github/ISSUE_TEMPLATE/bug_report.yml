name: Bug report
description: Report a reproducible problem with Game Night Bot
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Game Night Bot. Remove tokens, API keys,
        private Discord IDs and personal information from everything you post.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues for this problem.
          required: true
        - label: I read the README and troubleshooting section.
          required: true
        - label: I removed all tokens, API keys and private server information.
          required: true

  - type: input
    id: version
    attributes:
      label: Bot version
      description: Provide the release tag or commit hash.
      placeholder: "v1.0.0"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "Python 3.14.0"
    validations:
      required: true

  - type: dropdown
    id: hosting
    attributes:
      label: Hosting environment
      options:
        - bot-hosting.net
        - Linux server or VPS
        - Windows
        - macOS
        - Docker
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Explain the problem and what command or action triggered it.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect the bot to do?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant console output
      description: Paste only the relevant lines after removing all secrets and private IDs.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add screenshots or other useful information here.

